[package]
name = "rustblur"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = {version = "1.25.0", default-features = false}
image = {version = "0.25.10", default-features = false, features = ["rayon", "png", "jpeg", "qoi"]}
pollster = "0.4.0"
rayon = "1.12.0"
wgpu = {version = "29.0.3", default-features = false, features = ["wgsl", "vulkan"]}

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
panic = "abort"
