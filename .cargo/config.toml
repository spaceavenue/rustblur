[build]
target = "x86_64-unknown-linux-musl"

[unstable]
build-std = ["std", "panic_abort"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=native", "-C", "target-feature=+crt-static", "-C", "link-arg=-Wl,-z,stack-size=1048576", "-Z", "location-detail=none", "-Z", "fmt-debug=none"]
